<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2F3D2E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Comemos" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>¿Qué comemos?</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Captura el evento de instalación PWA antes de que cargue la app (suele
      // dispararse muy temprano; si esperamos a React, lo perdemos).
      window.__cmInstall = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__cmInstall = e;
        window.dispatchEvent(new Event('cm-installable'));
      });
      window.addEventListener('appinstalled', function () { window.__cmInstall = null; });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
